# 告警規則。條件成立且持續 `for` 這麼久，才會變成「告警中」（避免一閃即逝的誤報）。
#
# 門檻都是起始值，上線跑一陣子看實際數字再調。
# 目前告警只顯示在 Prometheus 的 Alerts 頁與 Grafana；要推到 Email / Teams
# 需要再加 Alertmanager 並填公司的寄信或 webhook 設定（見 monitoring/README.md）。

groups:
  - name: 存活
    rules:
      - alert: 監控目標失聯
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} @ {{ $labels.instance }} 抓不到資料"
          description: "主機掛了、exporter 停了，或防火牆擋住監控主機。先 ping 主機，再看該 exporter 容器。"

      - alert: 平台健康檢查失敗
        expr: probe_success{job="app-health"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} 回應不是 2xx 或逾時"
          description: "在 AP 主機上 `docker compose ps app`、`docker compose logs --tail 200 app`。"

      - alert: Redis 掛了
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "redis-exporter 連不上 Redis"
          description: "Redis 掛了 = 派工停擺、Run 事件通知中斷。"

      - alert: PostgreSQL 掛了
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "postgres-exporter 連不上 PostgreSQL"

  - name: 主機
    rules:
      - alert: CPU 長時間滿載
        expr: 100 * (1 - avg by (server, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.server }} CPU {{ $value | printf \"%.0f\" }}% 已持續 10 分鐘"

      - alert: 記憶體不足
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.server }} 可用記憶體剩 {{ $value | printf \"%.0f\" }}%"
          description: "接下來 Linux 會開始砍程序（OOM killer）。看 Grafana 哪個容器吃最多。"

      - alert: 磁碟快滿
        expr: |
          100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.server }} {{ $labels.mountpoint }} 剩 {{ $value | printf \"%.0f\" }}%"
          description: "常見原因：Docker image 堆積（registry 刪了要 garbage-collect）、log 沒切檔、PostgreSQL 資料成長。"

  - name: 容器
    rules:
      # cAdvisor 沒有「重啟次數」，改看「啟動時間被改了幾次」：每重啟一次就變一次
      - alert: 容器反覆重啟
        expr: changes(container_start_time_seconds{name!=""}[15m]) >= 3
        labels: { severity: warning }
        annotations:
          summary: "容器 {{ $labels.name }} 15 分鐘內重啟 {{ $value }} 次"
          description: "`docker logs --tail 200 {{ $labels.name }}`、`docker inspect {{ $labels.name }}` 看 State.ExitCode / OOMKilled。"

      - alert: 容器記憶體爆掉被殺
        expr: increase(container_oom_events_total{name!=""}[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "容器 {{ $labels.name }} 發生 OOM"
          description: "agent 常駐容器的 N 個 Run 共用 2 GB，太多 Run 同時跑會撐爆（見 compose.yaml 的 SANDBOX_RUNS_PER_CONTAINER）。"

      - alert: Agent 容器記憶體接近上限
        expr: |
          container_memory_working_set_bytes{container_label_zentra_managed="true"}
            / (container_spec_memory_limit_bytes{container_label_zentra_managed="true"} > 0) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Agent 容器 {{ $labels.name }} 已用 {{ $value | humanizePercentage }} 記憶體上限"

  - name: 派工
    rules:
      # 佇列只增不減 = 沒人在消化：worker 掛了、卡住，或量真的超過處理能力
      - alert: Celery 佇列堆積
        expr: redis_key_size{key=~"q.run|q.build"} > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Celery 佇列 {{ $labels.key }} 有 {{ $value }} 筆排隊已 10 分鐘"
          description: "`docker compose logs --tail 200 worker`；確認 worker 活著、沒有卡在某個任務。"

      - alert: Agent 工作佇列堆積
        expr: redis_key_size{key=~"agent_work:.*"} > 50
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "常駐容器佇列 {{ $labels.key }} 有 {{ $value }} 筆排隊已 10 分鐘"
          description: "該版本的常駐容器可能沒起來或卡住。佇列 key 的格式是 agent_work:{agent_id}:{agent_version_id}。"

  - name: 資料庫
    rules:
      - alert: PostgreSQL 連線快用完
        expr: |
          sum by (server, instance) (pg_stat_activity_count)
            / on (server, instance) pg_settings_max_connections > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "PostgreSQL 連線已用 {{ $value | humanizePercentage }}"
          description: "連線用完後 app / worker 都會報錯。查 pg_stat_activity 看是誰占著。"
