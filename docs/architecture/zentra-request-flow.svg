<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Zentra 請求到沙盒的整體資料流</title>
  <desc id="desc">由左到右呈現外部使用者透過 REST API 或 MCP 進入 FastAPI，寫入 PostgreSQL 並經 Redis 派送 Celery 任務，再由 worker 與 Sandbox Manager 透過 Docker API 建立每個 Run 專屬沙盒。沙盒只經 Internal Gateway 回寫事件與結果，完成後撤銷 run token 並刪除容器。圖中明確標示目前使用 Docker hardening，沒有 gVisor，核心隔離能力為 false。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1729"/>
      <stop offset="1" stop-color="#07101c"/>
    </linearGradient>
    <linearGradient id="apiGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a64"/>
      <stop offset="1" stop-color="#102744"/>
    </linearGradient>
    <linearGradient id="workerGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b3214"/>
      <stop offset="1" stop-color="#2d2418"/>
    </linearGradient>
    <linearGradient id="sandboxGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33225c"/>
      <stop offset="1" stop-color="#1e1c3e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6aa6d8" stroke-opacity="0.055"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#35d4ff"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#ffbd4a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#4de3a2"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#ff7180"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
      .title { font-size: 32px; font-weight: 750; fill: #f5fbff; letter-spacing: .5px; }
      .subtitle { font-size: 15px; fill: #9bb0c7; }
      .zone { fill: #081522; stroke: #29465e; stroke-width: 1.5; }
      .zone-title { font-size: 14px; font-weight: 700; fill: #7fa3bf; letter-spacing: 1.2px; }
      .card { fill: #0f2032; stroke: #33506a; stroke-width: 1.5; filter: url(#shadow); }
      .card-title { font-size: 19px; font-weight: 750; fill: #f4f9fd; }
      .label { font-size: 14px; font-weight: 620; fill: #d9e8f3; }
      .small { font-size: 12px; fill: #9db2c5; }
      .tiny { font-size: 11px; fill: #8298ac; }
      .pill { fill: #132b40; stroke: #2b526e; stroke-width: 1; }
      .flow { fill: none; stroke: #35d4ff; stroke-width: 3; marker-end: url(#arrowCyan); }
      .flow-back { fill: none; stroke: #4de3a2; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrowGreen); }
      .flow-clean { fill: none; stroke: #ff7180; stroke-width: 2.5; stroke-dasharray: 5 5; marker-end: url(#arrowRed); }
      .flow-notify { fill: none; stroke: #ffbd4a; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrowAmber); }
      .num { fill: #35d4ff; stroke: #062335; stroke-width: 3; }
      .numtext { font-size: 12px; font-weight: 800; fill: #04121e; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <rect width="1800" height="1120" fill="url(#grid)"/>
  <circle cx="1570" cy="80" r="260" fill="#145d87" opacity="0.07"/>
  <circle cx="1180" cy="1080" r="330" fill="#673ab7" opacity="0.06"/>

  <text id="diagram-title" class="title" x="56" y="58">Zentra · Request → Sandbox Flow</text>
  <text class="subtitle" x="56" y="86">單機 Docker Compose · REST / MCP 雙入口 · Celery 派工 · 一 Run 一盒 · PostgreSQL 持久化事件</text>
  <g transform="translate(1342 37)">
    <rect width="402" height="58" rx="12" fill="#321923" stroke="#ef5363" stroke-width="1.5"/>
    <circle cx="27" cy="29" r="10" fill="#ef5363"/><path d="M27 21v10m0 5v1" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="48" y="25" class="label" fill="#ffdce0">目前沒有 gVisor / runsc</text>
    <text x="48" y="44" class="small" fill="#ff9ca6">l2_kernel_isolation = false · 僅適用信任的程式碼</text>
  </g>

  <!-- deployment boundary -->
  <rect x="260" y="122" width="1484" height="862" rx="22" fill="#091725" fill-opacity="0.68" stroke="#47708e" stroke-width="1.6" stroke-dasharray="9 7"/>
  <rect x="282" y="108" width="318" height="30" rx="15" fill="#18324a" stroke="#47708e"/>
  <text x="302" y="129" class="zone-title">單一主機 · DOCKER COMPOSE + DYNAMIC SANDBOX</text>

  <!-- layer zones -->
  <rect class="zone" x="36" y="160" width="194" height="574" rx="18"/>
  <text class="zone-title" x="56" y="190">CALLERS</text>

  <rect class="zone" x="286" y="160" width="354" height="574" rx="18"/>
  <text class="zone-title" x="308" y="190">L0 · 接入 + 控制</text>

  <rect class="zone" x="670" y="160" width="286" height="574" rx="18"/>
  <text class="zone-title" x="692" y="190">L3 · 資料 / 匯流</text>

  <rect class="zone" x="986" y="160" width="286" height="574" rx="18"/>
  <text class="zone-title" x="1008" y="190">L1 · CELERY 派工</text>

  <rect class="zone" x="1302" y="160" width="414" height="574" rx="18"/>
  <text class="zone-title" x="1324" y="190">L2 · 隔離執行</text>

  <!-- callers -->
  <g filter="url(#shadow)">
    <rect x="56" y="222" width="154" height="92" rx="14" fill="#10283b" stroke="#3b6988"/>
    <circle cx="89" cy="258" r="16" fill="#25678d"/><circle cx="89" cy="251" r="6" fill="#bdeaff"/><path d="M76 278c2-10 24-10 26 0" fill="#bdeaff"/>
    <text x="115" y="255" class="label">使用者</text><text x="115" y="277" class="small">Console / CLI</text>
    <rect x="56" y="334" width="154" height="92" rx="14" fill="#10283b" stroke="#3b6988"/>
    <path d="M76 361h28v25H76zM81 366h18m-18 6h18m-18 6h11" fill="none" stroke="#70d7ff" stroke-width="2"/>
    <text x="115" y="367" class="label">外部系統</text><text x="115" y="389" class="small">Script / Service</text>
    <rect x="56" y="446" width="154" height="92" rx="14" fill="#10283b" stroke="#3b6988"/>
    <path d="M78 474l11-7 11 7v14l-11 7-11-7zM89 467v28m-11-21l22 14m0-14l-22 14" fill="none" stroke="#70d7ff" stroke-width="1.8"/>
    <text x="115" y="479" class="label">MCP Client</text><text x="115" y="501" class="small">Claude / IDE</text>
  </g>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="308" y="214" width="310" height="486" rx="16" fill="url(#apiGlow)" stroke="#278cc2" stroke-width="2"/>
    <circle cx="341" cy="250" r="18" fill="#1479aa"/><path d="M331 250h20m-10-10v20" stroke="#d7f5ff" stroke-width="2"/>
    <text x="372" y="248" class="card-title">api · FastAPI</text>
    <text x="372" y="269" class="small">同一個服務提供公開與內部接口</text>

    <rect class="pill" x="330" y="299" width="266" height="60" rx="10"/>
    <text x="348" y="323" class="label">REST API</text><text x="348" y="345" class="small">POST /v1/agents/{id}/runs</text>
    <rect class="pill" x="330" y="371" width="266" height="60" rx="10"/>
    <text x="348" y="395" class="label">MCP Interface</text><text x="348" y="417" class="small">/mcp/agents/{id} · tools/call</text>
    <rect class="pill" x="330" y="443" width="266" height="60" rx="10"/>
    <text x="348" y="467" class="label">Console + SSE</text><text x="348" y="489" class="small">StaticFiles · EventSource · /events</text>
    <rect x="330" y="526" width="266" height="112" rx="10" fill="#192b2a" stroke="#4de3a2" stroke-width="1.4"/>
    <path d="M349 553h18v17h-18zM353 553v-6c0-9 11-9 11 0v6" fill="none" stroke="#6bf1b7" stroke-width="2"/>
    <text x="378" y="558" class="label" fill="#caffea">Internal Gateway</text>
    <text x="348" y="585" class="small">bootstrap · events · result</text>
    <text x="348" y="604" class="small">驗 run token · 沙盒唯一網路對端</text>
    <text x="348" y="623" class="tiny">長期 LLM 憑證留在平台側</text>
    <rect x="330" y="652" width="266" height="28" rx="8" fill="#0d2133"/>
    <text x="348" y="671" class="small">狀態查詢 + SSE replay 以 DB seq 排序</text>
  </g>

  <!-- data stores -->
  <g filter="url(#shadow)">
    <rect x="692" y="214" width="242" height="254" rx="16" fill="#182b3d" stroke="#4e8cb4" stroke-width="1.8"/>
    <ellipse cx="735" cy="251" rx="25" ry="10" fill="#286a96" stroke="#91d5ff"/>
    <path d="M710 251v28c0 6 50 6 50 0v-28m-50 14c0 6 50 6 50 0" fill="#1e5274" stroke="#91d5ff"/>
    <text x="775" y="253" class="card-title">PostgreSQL 16</text>
    <text x="714" y="315" class="label">目前持久化真相</text>
    <text x="714" y="342" class="small">runs</text><text x="764" y="342" class="tiny">狀態 · input/output · error · usage</text>
    <text x="714" y="368" class="small">run_events</text><text x="797" y="368" class="tiny">事件 seq · payload · terminal</text>
    <line x1="714" y1="386" x2="912" y2="386" stroke="#34556d"/>
    <text x="714" y="408" class="tiny">agent_versions → ZEN-001</text>
    <text x="714" y="429" class="tiny">llm_calls → ZEN-002</text>
    <text x="714" y="450" class="tiny" fill="#78c9f0">目前資料庫只有 runs / run_events</text>

    <rect x="692" y="492" width="242" height="208" rx="16" fill="#302333" stroke="#b26cb9" stroke-width="1.8"/>
    <path d="M715 527c0-8 46-8 46 0v17c0 8-46 8-46 0zm0 17v17c0 8 46 8 46 0v-17" fill="#753e78" stroke="#ecb5f0"/>
    <text x="775" y="541" class="card-title">Redis 7</text>
    <text x="714" y="591" class="small">• Celery broker + result backend</text>
    <text x="714" y="615" class="small">• q.run / q.build</text>
    <text x="714" y="639" class="small">• run token + TTL + 撤銷索引</text>
    <text x="714" y="663" class="small">• 事件通知 → 喚醒 SSE</text>
    <text x="714" y="686" class="tiny">事件本體與順序仍以 PostgreSQL 為準</text>
  </g>

  <!-- worker -->
  <g filter="url(#shadow)">
    <rect x="1008" y="214" width="242" height="486" rx="16" fill="url(#workerGlow)" stroke="#d38a2c" stroke-width="2"/>
    <path d="M1035 238h30v30h-30zM1042 245h16v16h-16z" fill="none" stroke="#ffc66c" stroke-width="2"/>
    <text x="1080" y="252" class="card-title">Celery worker</text>
    <text x="1030" y="293" class="small">只做派工與生命週期控制</text>
    <text x="1030" y="314" class="tiny" fill="#ffd68f">P1：不 import / exec 使用者程式碼</text>
    <rect x="1030" y="338" width="198" height="70" rx="10" fill="#3c2d1a" stroke="#c98127"/>
    <text x="1048" y="365" class="label">runner-worker · q.run</text>
    <text x="1048" y="389" class="small">claim → token → create → wait</text>
    <rect x="1030" y="420" width="198" height="70" rx="10" fill="#3c2d1a" stroke="#c98127"/>
    <text x="1048" y="447" class="label">build-worker · q.build</text>
    <text x="1048" y="471" class="small">版本建置路徑（後續 ZEN-001）</text>
    <rect x="1030" y="514" width="198" height="150" rx="10" fill="#352a1d" stroke="#8f6630"/>
    <text x="1048" y="541" class="label">Run 狀態機</text>
    <text x="1048" y="568" class="small">QUEUED → SCHEDULING</text>
    <text x="1048" y="591" class="small">→ RUNNING</text>
    <text x="1048" y="614" class="small">→ SUCCEEDED / FAILED</text>
    <text x="1048" y="644" class="tiny">DB commit 後才發 Redis 通知</text>
  </g>

  <!-- Sandbox / Docker -->
  <g filter="url(#shadow)">
    <rect x="1324" y="214" width="370" height="486" rx="16" fill="url(#sandboxGlow)" stroke="#8e73ec" stroke-width="2"/>
    <rect x="1346" y="238" width="326" height="90" rx="12" fill="#262246" stroke="#7a64d8"/>
    <path d="M1368 263h23v20h-23zm26 0h23v20h-23zm-13-18h23v15h-23z" fill="none" stroke="#c4b8ff" stroke-width="2"/>
    <text x="1432" y="267" class="card-title">Sandbox Manager</text>
    <text x="1432" y="291" class="small">Docker API · reserve / create / wait</text>
    <text x="1432" y="312" class="tiny">destroy() 冪等 · 一 Run 一個容器</text>

    <rect x="1346" y="350" width="326" height="236" rx="14" fill="#211c43" stroke="#9b87f5" stroke-width="1.8"/>
    <rect x="1363" y="369" width="292" height="34" rx="7" fill="#604bb0"/>
    <text x="1380" y="392" class="label" fill="#fff">sandbox-&lt;run_id&gt; · Agent Runtime</text>
    <text x="1368" y="434" class="small">LangGraph build() → compile → execute</text>
    <text x="1368" y="459" class="small">只持有 run_id 綁定的短效 run token</text>
    <text x="1368" y="489" class="small" fill="#cfcbff">Docker hardening</text>
    <text x="1368" y="513" class="tiny">non-root 65534 · cap_drop ALL</text>
    <text x="1368" y="533" class="tiny">no-new-privileges · read-only rootfs</text>
    <text x="1368" y="553" class="tiny">tmpfs · CPU / RAM / PID / timeout limits</text>
    <text x="1368" y="575" class="tiny" fill="#ff9ca6">無 gVisor：不具獨立核心隔離</text>

    <rect x="1346" y="605" width="326" height="66" rx="10" fill="#182f30" stroke="#4de3a2"/>
    <text x="1365" y="632" class="label" fill="#b9f9dc">internal: true 網路</text>
    <text x="1365" y="654" class="small">不可直連 PostgreSQL / Redis / 外網</text>
  </g>

  <!-- primary left-to-right flow -->
  <path class="flow" d="M210 378H308"/>
  <circle class="num" cx="255" cy="378" r="14"/><text class="numtext" x="255" y="378">1</text>
  <text x="223" y="355" class="tiny">REST / MCP</text>

  <path class="flow" d="M618 329H656Q670 329 670 315H692"/>
  <circle class="num" cx="655" cy="329" r="14"/><text class="numtext" x="655" y="329">2</text>
  <text x="631" y="302" class="tiny">INSERT Run</text>

  <path class="flow" d="M618 401H646Q664 401 664 575Q664 596 692 596"/>
  <circle class="num" cx="655" cy="477" r="14"/><text class="numtext" x="655" y="477">3</text>
  <text x="624" y="457" class="tiny">enqueue</text>

  <path class="flow" d="M934 596H968Q986 596 986 374H1008"/>
  <circle class="num" cx="972" cy="489" r="14"/><text class="numtext" x="972" y="489">4</text>
  <text x="943" y="469" class="tiny">dequeue</text>

  <path class="flow" d="M1250 373H1290Q1302 373 1302 283H1346"/>
  <circle class="num" cx="1290" cy="340" r="14"/><text class="numtext" x="1290" y="340">5</text>
  <text x="1262" y="318" class="tiny">Docker API</text>
  <path class="flow" d="M1509 328V350"/>

  <!-- sandbox callback path -->
  <path class="flow-back" d="M1346 468H1284V770H604V583H596"/>
  <circle cx="1260" cy="770" r="14" fill="#4de3a2" stroke="#08251c" stroke-width="3"/>
  <text class="numtext" x="1260" y="770">6</text>
  <text x="972" y="758" class="label" fill="#8af1c4">事件 / result 回寫（唯一出口）</text>
  <text x="972" y="782" class="tiny">Sandbox → Internal Gateway → PostgreSQL commit</text>

  <path class="flow-notify" d="M596 565H648Q670 565 670 395H692"/>
  <path class="flow-notify" d="M692 630H640Q620 630 620 473H596"/>
  <circle cx="641" cy="565" r="14" fill="#ffbd4a" stroke="#382306" stroke-width="3"/>
  <text class="numtext" x="641" y="565">7</text>
  <text x="607" y="545" class="tiny">DB + notify</text>

  <path class="flow-notify" d="M330 473H258Q238 473 238 610H178V538"/>
  <circle cx="257" cy="610" r="14" fill="#ffbd4a" stroke="#382306" stroke-width="3"/>
  <text class="numtext" x="257" y="610">8</text>
  <text x="56" y="644" class="small" fill="#ffd487">SSE：Redis 喚醒，API 從 DB</text>
  <text x="56" y="664" class="small" fill="#ffd487">依 seq 續傳 / 去重後送回前端</text>

  <path class="flow-clean" d="M1180 664V822H1508V700"/>
  <circle cx="1337" cy="822" r="14" fill="#ff7180" stroke="#3b0e14" stroke-width="3"/>
  <text class="numtext" x="1337" y="822">9</text>
  <text x="1370" y="818" class="label" fill="#ffabb3">finally：撤銷 run token → destroy sandbox → release quota</text>
  <text x="1370" y="839" class="tiny">容器與 tmpfs 結束即銷毀，不重用</text>

  <!-- narrative strip -->
  <g transform="translate(36 868)">
    <rect width="1680" height="116" rx="18" fill="#0b1d2c" stroke="#2c536d" stroke-width="1.4"/>
    <text x="24" y="31" class="zone-title">一次 RUN 的簡化流程</text>
    <g transform="translate(24 49)">
      <rect width="158" height="42" rx="10" fill="#15324a" stroke="#35d4ff"/><text x="79" y="26" class="small" text-anchor="middle">1  REST / MCP 呼叫</text>
      <path d="M162 21h30" class="flow"/>
      <rect x="198" width="188" height="42" rx="10" fill="#15324a" stroke="#35d4ff"/><text x="292" y="26" class="small" text-anchor="middle">2  建立 runs + QUEUED</text>
      <path d="M390 21h30" class="flow"/>
      <rect x="426" width="172" height="42" rx="10" fill="#302333" stroke="#b26cb9"/><text x="512" y="26" class="small" text-anchor="middle">3  Redis q.run</text>
      <path d="M602 21h30" class="flow"/>
      <rect x="638" width="190" height="42" rx="10" fill="#3c2d1a" stroke="#d38a2c"/><text x="733" y="26" class="small" text-anchor="middle">4  Worker claim + token</text>
      <path d="M832 21h30" class="flow"/>
      <rect x="868" width="204" height="42" rx="10" fill="#262246" stroke="#8e73ec"/><text x="970" y="26" class="small" text-anchor="middle">5  Docker 建立 Sandbox</text>
      <path d="M1076 21h30" class="flow"/>
      <rect x="1112" width="220" height="42" rx="10" fill="#182f30" stroke="#4de3a2"/><text x="1222" y="26" class="small" text-anchor="middle">6–8  回寫事件 + SSE</text>
      <path d="M1336 21h30" class="flow"/>
      <rect x="1372" width="260" height="42" rx="10" fill="#321923" stroke="#ff7180"/><text x="1502" y="26" class="small" text-anchor="middle">9  終態 + 撤 token + 銷毀</text>
    </g>
  </g>

  <!-- legend/footer -->
  <g transform="translate(36 1014)">
    <path d="M0 18h42" class="flow"/><text x="54" y="23" class="small">控制 / 派工（左 → 右）</text>
    <path d="M242 18h42" class="flow-back"/><text x="296" y="23" class="small">Sandbox 回寫</text>
    <path d="M452 18h42" class="flow-notify"/><text x="506" y="23" class="small">事件通知 / SSE</text>
    <path d="M694 18h42" class="flow-clean"/><text x="748" y="23" class="small">結束清理</text>
    <text x="1124" y="23" class="tiny">對齊 SPEC v0.2.2 · 目前實作：ZEN-000</text>
  </g>
  <text x="36" y="1085" class="tiny">安全邊界：Sandbox 不可直連 PostgreSQL / Redis；所有 bootstrap、事件與結果均經 api 的 Internal Gateway。Docker hardening 不等於 gVisor 核心隔離。</text>
</svg>
