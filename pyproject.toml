[project]
name = "zentra"
version = "0.1.0"
description = "Zentra Agent Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "docker>=7.1",
    "httpx>=0.28",
    "fastmcp>=2.14.0",
    "jsonschema>=4.23",
    "cryptography>=43",   # per-agent LLM 憑證的靜態加密（ZEN-012）
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "anyio>=4.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
