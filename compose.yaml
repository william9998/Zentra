# Zentra — 本機與正式是同一套（ADR-0005）。五個長駐服務。
# 沙盒不在這裡：它由 Sandbox Manager 經 Docker API 為每個 Run 動態建立，結束即銷毀。

name: zentra

services:
  postgres:
    image: pgvector/pgvector:pg16          # 擴充先備著，MVP 不用（SPEC §6）
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zentra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zentra}
      POSTGRES_DB: ${POSTGRES_DB:-zentra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zentra}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [zentra-net]                 # 絕對不要接 zentra-sandbox-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [zentra-net]                 # 絕對不要接 zentra-sandbox-net

  # 內部 OCI Registry（ADR-0009 / ZEN-009）。使用者在**這台主機上**
  #   docker tag <img> localhost:6000/<repo>:<semver> && docker push …
  # 再用既有的 JSON 端點以 digest 註冊版本。平台不接收 image 檔案上傳。
  #
  # 沒有任何平台服務會連它：它的 client 只有主機上的 Docker daemon（pull）
  # 與使用者的 CLI（push），兩者都走 loopback。所以 app / worker 都不 depends_on 它。
  registry:
    image: registry:2                      # 上游原版，不要自己 build 或換基底
    environment:
      # 寫死 false：連誤刪已發布版本的 manifest 都做不到（P5）。
      # 清理是維運者用離線程序做的，不是 API 能碰的事。
      REGISTRY_STORAGE_DELETE_ENABLED: "false"
    volumes:
      - registrydata:/var/lib/registry
    # 只綁 loopback。這不是文件規定，是「只限同機」的執行手段本身 ——
    # 這個 registry 沒有 TLS、沒有認證，綁 0.0.0.0 等於把它放上網。
    # 要遠端 push → 新 ADR，且必須先解決 TLS 與認證，順序不可顛倒。
    #
    # 為什麼一定要發布 port：執行 pull 的是主機上的 Docker daemon，它不在
    # zentra-net 上，解析不到服務名 `registry`。localhost 另外免去改
    # daemon.json 的 insecure-registries（Docker 對 localhost 預設允許 HTTP）。
    #
    # 主機端是 6000，不是 registry 慣用的 5000：macOS 的 AirPlay Receiver 預設
    # LISTEN 在 *:5000，會蓋掉這個服務（回 403，Server: AirTunes/...）。
    # 容器內仍是 5000 —— 換的只有主機端。
    #
    # port 仍然寫死，**沒有做成設定項**：做成設定項就需要一個端點讓 Console
    # 知道實際值，那是為環境細節新增 API 表面（ADR-0009 R3）。
    ports: ["127.0.0.1:6000:5000"]
    # 刻意沒有 healthcheck：registry:2 裡沒有 wget/curl，與其為此加工具或換基底
    # 映像，不如不要養一個假的檢查。
    networks: [zentra-net]                 # 絕對不要接 zentra-sandbox-net

  # 整個 HTTP 門面，不只是 REST API —— 這是它叫 app 不叫 api 的原因：
  #   /v1/*        對外 REST
  #   /mcp/*       MCP 門面
  #   /console/*   Console 靜態檔（ADR-0006：沒有獨立的前端容器、沒有 BFF、沒有 CORS）
  #   /internal/*  Internal Gateway —— 沙盒唯一的對端（P4）
  #
  # 原始碼仍在 apps/api/：那個目錄放的是 HTTP 層本身，改叫 apps/app 只會讓
  # `apps.app.main:app` 更難讀，而且要動每一個 import。目錄名與服務名刻意脫鉤。
  app:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ZENTRA_ENV: ${ZENTRA_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://zentra:zentra@postgres:5432/zentra}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-zentra/agent-runtime:dev}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-zentra-sandbox-net}
      # ⚠️ 本機若有 .env 且設了這一行，它會蓋掉這裡的預設值。服務改名時要一起改，
      #    否則沙盒會拿到指向舊名字的 gateway，Run 會 FAILED 且沒有任何事件。
      SANDBOX_GATEWAY_URL: ${SANDBOX_GATEWAY_URL:-http://app:8000/internal}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-10}
      # ── LLM（ZEN-002 / P4）──────────────────────────────────────────
      # 真金鑰**只**出現在這裡，也就是 app 服務上。
      # worker 沒有這幾個變數，所以它不可能把金鑰注入沙盒 —— 這不是靠紀律，
      # 是靠「worker 手上根本沒有」。沙盒拿到的永遠只有 run token。
      ZENTRA_LLM_BASE_URL: ${ZENTRA_LLM_BASE_URL:-https://api.openai.com/v1}
      ZENTRA_LLM_API_KEY: ${ZENTRA_LLM_API_KEY:-}
      ZENTRA_LLM_DEFAULT_MODEL: ${ZENTRA_LLM_DEFAULT_MODEL:-gpt-4o-mini}
      # per-agent 憑證的靜態加密金鑰（ZEN-012）。沒設定 → 平台拒絕儲存任何憑證，
      # 而不是退回明文。產生：
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # ⚠️ 換掉它，既有的 agent 憑證全部解不開 —— 它就是那些憑證的鎖。
      ZENTRA_SECRET_KEY: ${ZENTRA_SECRET_KEY:-}
    # .env 是選用的。要用 LLM 就在 .env 放 ZENTRA_LLM_API_KEY —— 放這裡是對的，
    # 它只會被 app 讀到。**絕對不要**把它加進下面 worker 的 environment。
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
    # app 是唯一同時接兩個網段的服務 —— 它是沙盒對外的唯一的橋（SPEC §5）
    networks: [zentra-net, zentra-sandbox-net]

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    # -B = embedded beat，驅動閒置容器回收（ZEN-015）。schedule 檔寫到 /tmp，
    # 因為工作目錄在 image 裡是唯讀的。單 worker 才能這樣掛，見 celery_app.py。
    command: ["celery", "-A", "apps.worker.celery_app", "worker", "-Q", "q.run,q.build", "-l", "info", "--concurrency", "10", "-B", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      ZENTRA_ENV: ${ZENTRA_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://zentra:zentra@postgres:5432/zentra}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-zentra/agent-runtime:dev}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-zentra-sandbox-net}
      SANDBOX_GATEWAY_URL: ${SANDBOX_GATEWAY_URL:-http://app:8000/internal}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-10}
      # Path only. Credential bytes are a read-only compose secret below.
      ZENTRA_REGISTRY_AUTH_FILE: /run/secrets/zentra_registry_auth
    # .env 是選用的：ZEN-000 沒有任何機密要放。ZEN-002 要 LLM 金鑰時再建。
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      app: { condition: service_healthy }
    volumes:
      # 只有 worker 掛 docker.sock —— 它要動態建沙盒。app 不准掛。
      # ⚠️ 能操作 docker.sock 等同主機 root，這個風險在 v0.2 是常駐的（架構文件 §9）
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - source: zentra_registry_auth
        target: zentra_registry_auth
        mode: 0400
    networks: [zentra-net]

networks:
  zentra-net:
    name: zentra-net
  zentra-sandbox-net:
    name: zentra-sandbox-net
    internal: true                         # L1：沒有對外路由。唯一對端是 app

volumes:
  pgdata:
  # 備份時與 pgdata 同等重要：DB 存的是 digest，image 本體在這裡。
  # 只備份其中一個，還原後 PUBLISHED 的版本會拉不到 image。
  registrydata:

secrets:
  # Standard Docker config JSON: {"auths":{"registry":{"auth":"..."}}}.
  # The committed default is empty/public-only. Production supplies a file
  # outside the repository with ZENTRA_REGISTRY_AUTH_FILE on the compose host.
  zentra_registry_auth:
    file: ${ZENTRA_REGISTRY_AUTH_FILE:-docker/registry-auth.empty.json}
